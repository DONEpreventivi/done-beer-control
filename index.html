const A=document.getElementById("app"),I={new:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',archive:'<svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/></svg>',counts:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12h3m10 0h3M12 4v3m0 10v3M6.3 6.3l2.1 2.1m7.2 7.2 2.1 2.1m0-11.4-2.1 2.1m-7.2 7.2-2.1 2.1"/></svg>'};
function save(){localStorage.setItem("doneBeer",JSON.stringify(D))}function logo(){return `<img class="logo" src="${LOGO}">`}function nav(x){return `<nav class="nav">${[["new","Nuovo"],["archive","Archivio"],["counts","Conteggi"],["settings","Impostazioni"]].map(([k,n])=>`<button class="tab ${x==k?"on":""}" onclick="go('${k}')">${I[k]}${n}</button>`).join("")}</nav>`}function page(b,n=""){A.innerHTML=`<main>${logo()}${b}</main>${nav(n)}`}function go(x){S=x;if(x=="new")Q={};render()}function eu(n){return new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n||0)}function today(){let d=new Date;return d.toISOString().slice(0,10)}function itd(x){let [y,m,d]=x.split("-");return `${d}/${m}/${y}`}function mk(x){return x.slice(0,7)}function ml(x){let [y,m]=x.split("-");return ["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"][m-1]+" "+y}function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function calc(items){let t=0,p=0;items.forEach(x=>{t+=x.price*x.qty;let isGas=x.type==="gas";p+=(isGas?x.price:(x.price-x.liters*(x.return||0)))*x.qty});return{total:t*1.22,pay:p*1.22}}
function ptype(p){return p.type==="gas"?"gas":"beer"}
function render(){({home,nuovo,preview,archive,order,counts,month,settings,product,historical})[{new:"nuovo"}[S]||S]()}
function home(){page(`<div class="home"><button class="primary" onclick="go('new')">NUOVO ORDINE</button></div>`)}
function nuovo(){let ps=D.products.filter(p=>p.active),r=ps.map(p=>`<div class="card row"><div><div class="name">${esc(p.name)}</div><div class="meta">${ptype(p)==="gas"?"BOMBOLA GAS · nessun rientro":p.liters+" L"} · ${eu(p.price)} + IVA</div></div><div class="step"><button onclick="chg('${p.id}',-1)">−</button><b>${Q[p.id]||0}</b><button onclick="chg('${p.id}',1)">+</button></div></div>`).join("");page(`<div class="eye">Nuovo ordine</div><h1>Seleziona i fusti</h1>${r}<button class="primary" style="margin-top:18px" onclick="prev()">CONFERMA</button>`,"new")}function chg(id,d){Q[id]=Math.max(0,(Q[id]||0)+d);nuovo()}function prev(){let items=D.products.filter(p=>Q[p.id]).map(p=>({name:p.name,liters:p.liters,price:p.price,return:ptype(p)==="gas"?0:p.return,type:ptype(p),qty:Q[p.id]}));if(!items.length)return toast("Seleziona almeno un fusto");PRE={date:today(),items};S="preview";render()}
function preview(){let c=calc(PRE.items),r=PRE.items.map(x=>`<div class="detail"><h3>${x.qty} fust${x.qty==1?"o":"i"} — ${esc(x.name)}</h3><p>${x.qty*x.liters} litri · ${eu(x.price)} + IVA cad.</p></div>`).join("");page(`<button class="back" onclick="S='new';render()">← Indietro</button><div class="eye">Anteprima ordine</div><h1>${itd(PRE.date)}</h1><div class="card">${r}</div><div class="total"><div class="tr">Totale IVA inclusa <b>${eu(c.total)}</b></div></div><button class="primary" onclick="store()">SALVA ORDINE</button><div class="actions" style="margin-top:8px"><button class="mail" onclick="mail(PRE)">MAIL</button><button class="wa" onclick="wa(PRE)">WHATSAPP</button></div>`,"new")}function store(){D.orders.push(JSON.parse(JSON.stringify(PRE)));D.orders.sort((a,b)=>b.date.localeCompare(a.date));save();S="archive";render();toast("Ordine salvato")}function txt(o){let c=calc(o.items);return o.items.map(x=>`${x.qty} fust${x.qty==1?"o":"i"} - ${x.name}`).join("\n")+`\n\nCosto totale ordine IVA inclusa: ${eu(c.total)}`}function mail(o){location.href=`mailto:?subject=${encodeURIComponent("Ordine D.ONE - "+itd(o.date))}&body=${encodeURIComponent(txt(o))}`}function wa(o){window.open(`https://wa.me/?text=${encodeURIComponent(txt(o))}`,"_blank")}
function groups(){let g={};D.orders.forEach((o,i)=>(g[mk(o.date)]??=[]).push({o,i}));return g}function archive(){let g=groups(),b=`<div class="eye">Archivio</div><h1>Ordini</h1>`;Object.keys(g).sort().reverse().forEach(k=>{b+=`<div class="month">${ml(k)}</div>`+g[k].map(({o,i})=>{let c=calc(o.items),n=o.items.reduce((s,x)=>s+x.qty,0);return `<div class="card row" onclick="SEL=${i};S='order';render()"><div><div class="name">${itd(o.date)}</div><div class="meta">${n} fusti · ${eu(c.total)} i.i.</div></div><div class="chev">›</div></div>`}).join("")});if(!D.orders.length)b+=`<div class="empty">Nessun ordine archiviato.</div>`;page(b,"archive")}
function order(){let o=D.orders[SEL],c=calc(o.items),r=o.items.map(x=>`<div class="detail"><h3>${x.qty} fust${x.qty==1?"o":"i"} ${esc(x.name)}</h3><p>${x.qty*x.liters} litri (${x.liters} cad.)</p><p>${eu(x.price*x.qty)} + IVA 22%</p><b>${eu(x.price*x.qty*1.22)}</b></div>`).join("");page(`<button class="back" onclick="go('archive')">← Archivio</button><div class="eye">Ordine</div><h1>${itd(o.date)}</h1><div class="card">${r}</div><div class="total"><div class="tr">Totale IVA inclusa <b>${eu(c.total)}</b></div></div><div class="actions"><button class="mail" onclick="mail(D.orders[SEL])">MAIL</button><button class="wa" onclick="wa(D.orders[SEL])">WHATSAPP</button></div>`,"archive")}
function counts(){let g=groups(),b=`<div class="eye">Conteggi</div><h1>Scegli il mese</h1>`;Object.keys(g).sort().reverse().forEach(k=>b+=`<div class="card row" onclick="M='${k}';S='month';render()"><div class="name">${ml(k)}</div><div class="chev">›</div></div>`);if(!Object.keys(g).length)b+=`<div class="empty">Nessun mese disponibile.</div>`;page(b,"counts")}
function month(){let os=D.orders.filter(o=>mk(o.date)==M),all=os.flatMap(o=>o.items),c=calc(all),b={};all.forEach(x=>{let k=x.name+"|"+x.price+"|"+x.liters+"|"+x.return;(b[k]??={...x,qty:0,rows:[]}).qty+=x.qty});Object.values(b).forEach(p=>os.forEach(o=>o.items.filter(x=>x.name==p.name&&x.price==p.price&&x.liters==p.liters).forEach(x=>p.rows.push({d:o.date,q:x.qty}))));let r=Object.values(b).map(p=>`<div class="card"><div class="name">${p.qty} fusti ${esc(p.name)}</div><div class="meta">${p.qty*p.liters} litri totali</div>${p.rows.map(x=>`<div class="meta" style="margin-top:8px">${x.q} fust${x.q==1?"o":"i"} · ${itd(x.d)} · ${eu(x.q*p.price)} + IVA</div>`).join("")}</div>`).join("");page(`<button class="back" onclick="go('counts')">← Conteggi</button><div class="eye">Report mese</div><h1>${ml(M)}</h1>${r}<div class="total"><div class="tr">TOTALE (IVA inclusa)<b>${eu(c.total)}</b></div><div class="tr">NOTA CREDITO (fuori IVA)<b>${eu(all.reduce((z,x)=>z+(x.type==="gas"?0:x.liters*(x.return||0)*x.qty),0))}</b></div><div class="tr pay">PAGARE (IVA inclusa)<b>${eu(c.pay)}</b></div></div><button class="primary" onclick="exportMonthPDF()">ESPORTA PDF MESE</button>`,"counts")}
function settings(){let r=D.products.map((p,i)=>`<div class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="meta">${ptype(p)==="gas"?"BOMBOLA GAS · nessun rientro":p.liters+" L · "+eu(p.price)+" + IVA · rientro "+eu(p.return)+"/L"}</div></div><span class="pill ${p.active?"a":""}">${p.active?"ATTIVO":"NON ATTIVO"}</span></div><button class="link" onclick="EDIT=${i};S='product';render()">MODIFICA</button></div>`).join("");page(`<div class="eye">Impostazioni</div><h1>Prodotti</h1>${r}
<div class="actions">
<button class="primary" onclick="EDIT=null;window.NEWTYPE='beer';S='product';render()">+ FUSTO</button>
<button class="primary" onclick="EDIT=null;window.NEWTYPE='gas';S='product';render()">+ BOMBOLA GAS</button>
</div><div style="height:28px"></div><div class="eye">Storico 2026</div>
<div class="card"><div class="name">Inserisci vecchio ordine</div><p class="note">Crea manualmente un ordine retroattivo scegliendo data, prodotti, quantità e valori storici.</p><button class="small" style="width:100%;margin-top:10px;background:var(--y)" onclick="startHistorical()">INSERISCI ORDINE RETROATTIVO</button></div>
<div class="card"><div class="name">Importa ordini precedenti</div><p class="note">CSV con colonne: Data; Prodotto; Quantità; Litri; Prezzo netto; Rientro €/L. Le righe con la stessa data vengono considerate un unico ordine.</p><label class="file">IMPORTA CSV<input hidden type="file" accept=".csv" onchange="csv(this.files[0])"></label></div><div class="card"><div class="name">Backup</div><p class="note">Salva prodotti, prezzi storici e ordini.</p><button class="small" style="width:100%;margin-top:10px" onclick="backup()">ESPORTA BACKUP</button><label class="file">RIPRISTINA BACKUP<input hidden type="file" accept=".json" onchange="restore(this.files[0])"></label></div>`,"settings")}
function product(){
 let p=EDIT==null?{name:"",liters:30,price:0,return:1,active:true,type:(window.NEWTYPE||"beer")}:D.products[EDIT];
 p.type=ptype(p);window.ACT=p.active;window.PTYPE=p.type;
 let isGas=p.type==="gas";
 page(`<button class="back" onclick="go('settings')">← Impostazioni</button>
 <div class="eye">${EDIT==null?(isGas?"Nuova bombola gas":"Nuovo fusto"):"Modifica prodotto"}</div>
 <h1>${EDIT==null?(isGas?"Aggiungi bombola":"Aggiungi referenza"):esc(p.name)}</h1>
 <div class="card">
 <div class="field"><label>Tipo</label><input value="${isGas?"Bombola gas":"Fusto birra"}" disabled></div>
 <div class="field"><label>Nome prodotto</label><input id="pn" type="text" value="${esc(p.name)}"></div>
 ${isGas?"":`<div class="field"><label>Litri per fusto</label><input id="pl" type="number" value="${p.liters}"></div>`}
 <div class="field"><label>Prezzo netto ${isGas?"per bombola":"per fusto"}</label><input id="pp" type="number" step=".01" value="${p.price}"></div>
 ${isGas?`<div class="field"><label>Rientro</label><input value="Nessun rientro" disabled></div>`:`<div class="field"><label>Rientro €/litro</label><input id="pr" type="number" step=".01" value="${p.return}"></div>`}
 <div class="field"><label>Disponibilità prodotto</label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button id="statusOn" type="button" class="small" style="background:${p.active?"var(--y)":"#333"};color:${p.active?"#111":"#aaa"}" onclick="setProductStatus(true)">ATTIVO</button>
<button id="statusOff" type="button" class="small" style="background:${!p.active?"var(--y)":"#333"};color:${!p.active?"#111":"#aaa"}" onclick="setProductStatus(false)">DISATTIVATO</button>
</div>
<p class="note">Se disattivato, il prodotto non compare più in “Nuovo ordine”, ma rimane nello storico e nei conteggi precedenti.</p>
</div>
 </div><button class="primary" onclick="saveP()">SALVA</button>
 <p class="note">${isGas?"Le bombole vengono conteggiate al prezzo pieno e non generano nota credito.":"Le modifiche valgono solo per i nuovi ordini. I dati salvati negli ordini precedenti restano invariati."}</p>`,"settings")
}
function setProductStatus(v){
 ACT=v;
 let on=document.getElementById("statusOn"),off=document.getElementById("statusOff");
 if(on){on.style.background=v?"var(--y)":"#333";on.style.color=v?"#111":"#aaa"}
 if(off){off.style.background=!v?"var(--y)":"#333";off.style.color=!v?"#111":"#aaa"}
}
function saveP(){
 let isGas=window.PTYPE==="gas";
 let p={id:EDIT==null?"p"+Date.now():D.products[EDIT].id,name:pn.value.trim(),liters:isGas?0:+pl.value,price:+pp.value,return:isGas?0:+pr.value,active:ACT,type:isGas?"gas":"beer"};
 if(!p.name||(!isGas&&p.liters<=0))return toast("Controlla i dati");
 if(EDIT==null)D.products.push(p);else D.products[EDIT]=p;
 save();go("settings");toast(isGas?"Bombola salvata":"Prodotto salvato")
}
function num(x){return +(String(x||0).replace(",",".").replace(/[^\d.-]/g,""))}function date(x){let m=String(x).trim().match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(!m)return null;return `${m[3].length==2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
function csv(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let L=r.result.replace(/^\uFEFF/,"").split(/\r?\n/).filter(Boolean),sep=L[0].includes(";")?";":",",g={};L.slice(1).forEach(l=>{let c=l.split(sep).map(v=>v.trim().replace(/^"|"$/g,"")),d=date(c[0]);if(d)(g[d]??=[]).push({name:c[1],qty:num(c[2]),liters:num(c[3]),price:num(c[4]),return:num(c[5]||1)})});Object.entries(g).forEach(([d,items])=>D.orders.push({date:d,items}));D.orders.sort((a,b)=>b.date.localeCompare(a.date));save();settings();toast(Object.keys(g).length+" ordini importati")}catch(e){toast("CSV non valido")}};r.readAsText(f)}
function backup(){let b=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="DONE_backup_"+today()+".json";a.click()}function restore(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.orders)throw 0;D=x;save();settings();toast("Backup ripristinato")}catch(e){toast("Backup non valido")}};r.readAsText(f)}

let HIST=null;
function startHistorical(){
 HIST={date:today(),items:D.products.map(p=>({name:p.name,liters:p.liters,price:p.price,return:ptype(p)==="gas"?0:p.return,type:ptype(p),qty:0}))};
 S="historical";render()
}
function historical(){
 let rows=HIST.items.map((x,i)=>`<div class="card"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="meta">${x.type==="gas"?"BOMBOLA GAS · nessun rientro":x.liters+" L · valori modificabili per lo storico"}</div></div><div class="step"><button onclick="HIST.items[${i}].qty=Math.max(0,HIST.items[${i}].qty-1);historical()">−</button><b>${x.qty}</b><button onclick="HIST.items[${i}].qty++;historical()">+</button></div></div><div class="field"><label>Prezzo netto storico / fusto</label><input type="number" step=".01" value="${x.price}" onchange="HIST.items[${i}].price=+this.value"></div>${x.type==="gas"?"":`<div class="field"><label>Rientro storico €/litro</label><input type="number" step=".01" value="${x.return}" onchange="HIST.items[${i}].return=+this.value"></div>`}</div>`).join("");
 page(`<button class="back" onclick="go('settings')">← Impostazioni</button><div class="eye">Ordine retroattivo</div><h1>Inserisci storico</h1><div class="field"><label>Data ordine</label><input type="date" value="${HIST.date}" onchange="HIST.date=this.value"></div>${rows}<button class="primary" onclick="saveHistorical()">SALVA VECCHIO ORDINE</button>`,"settings")
}
function saveHistorical(){
 let items=HIST.items.filter(x=>x.qty>0).map(x=>({...x}));
 if(!HIST.date||!items.length)return toast("Inserisci data e almeno un fusto");
 D.orders.push({date:HIST.date,items});D.orders.sort((a,b)=>b.date.localeCompare(a.date));save();S="archive";render();toast("Ordine retroattivo salvato")
}
function exportMonthPDF(){
 if(!window.jspdf){toast("PDF non disponibile senza connessione");return}
 const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"});
 let os=D.orders.filter(o=>mk(o.date)==M).sort((a,b)=>a.date.localeCompare(b.date));
 let all=os.flatMap(o=>o.items), totals=calc(all), y=18;
 doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text("D.ONE TORINO",15,y);y+=8;
 doc.setFontSize(13);doc.text("REPORT ORDINI BIRRA - "+ml(M),15,y);y+=9;
 doc.setDrawColor(30);doc.line(15,y,195,y);y+=7;
 doc.setFontSize(9);doc.setFont("helvetica","normal");
 function ensure(h=12){if(y+h>282){doc.addPage();y=18}}
 os.forEach(o=>{
   ensure(18);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Ordine del "+itd(o.date),15,y);y+=6;
   o.items.forEach(x=>{
     ensure(22);
     let gross=x.price*x.qty*1.22;
     let isGas=x.type==="gas";
     let credit=isGas?0:x.liters*(x.return||0)*x.qty;
     let payable=(x.price*x.qty-credit)*1.22;
     doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(`${x.qty} fust${x.qty==1?"o":"i"} - ${x.name}`,18,y);y+=5;
     doc.setFont("helvetica","normal");doc.setFontSize(8.5);
     doc.text(`${x.qty*x.liters} L totali | ${eu(x.price)} + IVA cad.`,18,y);y+=4.5;
     doc.text(`Costo presunto IVA inclusa: ${eu(gross)}`,18,y);y+=4.5;
     doc.text(isGas?`Nota credito: nessuna`:`Nota credito (fuori IVA): ${eu(x.return)}/L x ${x.qty*x.liters} L = ${eu(credit)}`,18,y);y+=4.5;
     doc.text(`Da pagare IVA inclusa: ${eu(payable)}`,18,y);y+=7;
   });
   y+=2;
 });
 ensure(35);doc.setDrawColor(30);doc.line(15,y,195,y);y+=8;
 let creditNet=all.reduce((s,x)=>s+(x.type==="gas"?0:x.liters*(x.return||0)*x.qty),0);
 doc.setFont("helvetica","bold");doc.setFontSize(10);
 doc.text(`COSTO TOTALE PRESUNTO (IVA inclusa): ${eu(totals.total)}`,15,y);y+=6;
 doc.text(`NOTA CREDITO TOTALE (fuori IVA): ${eu(creditNet)}`,15,y);y+=6;
 doc.setFontSize(12);doc.text(`TOTALE DA PAGARE (IVA inclusa): ${eu(totals.pay)}`,15,y);
 doc.save(`DONE_report_${M}.pdf`)
}

render();</script></body></html>
