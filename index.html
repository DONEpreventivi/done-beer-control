 if(!window.jspdf){toast("PDF non disponibile senza connessione");return}
 const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"});
 let os=D.orders.filter(o=>mk(o.date)==M).sort((a,b)=>a.date.localeCompare(b.date));
 let all=os.flatMap(o=>o.items), totals=calc(all), y=15;
 try{doc.addImage(PDFLOGO,"PNG",15,y,34.00,18.26);y+=24.26}catch(e){y+=3}
 doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text("REPORT ORDINI BIRRA - "+ml(M),15,y);y+=9;
 doc.setDrawColor(30);doc.line(15,y,195,y);y+=7;
 doc.setFontSize(9);doc.setFont("helvetica","normal");
 function ensure(h=12){if(y+h>282){doc.addPage();y=18}}
 os.forEach(o=>{
   ensure(18);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Ordine del "+itd(o.date),15,y);y+=6;
   o.items.forEach(x=>{
     ensure(22);
     let gross=x.price*x.qty*1.22;
     let isGas=x.type==="gas";
     let credit=isGas?0:x.liters*(x.return||0)*x.qty;
     let payable=(x.price*x.qty-credit)*1.22;
     doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(`${x.qty} fust${x.qty==1?"o":"i"} - ${x.name}`,18,y);y+=5;
     doc.setFont("helvetica","normal");doc.setFontSize(8.5);
     doc.text(`${x.qty*x.liters} L totali | ${eu(x.price)} + IVA cad.`,18,y);y+=4.5;
     doc.text(`Costo presunto IVA inclusa: ${eu(gross)}`,18,y);y+=4.5;
     doc.text(isGas?`Nota credito: nessuna`:`Nota credito (fuori IVA): ${eu(x.return)}/L x ${x.qty*x.liters} L = ${eu(credit)}`,18,y);y+=4.5;
     doc.text(`Da pagare IVA inclusa: ${eu(payable)}`,18,y);y+=7;
   });
   y+=2;
 });
 ensure(35);doc.setDrawColor(30);doc.line(15,y,195,y);y+=8;
 let creditNet=all.reduce((s,x)=>s+(x.type==="gas"?0:x.liters*(x.return||0)*x.qty),0);
 doc.setFont("helvetica","bold");doc.setFontSize(10);
 doc.text(`COSTO TOTALE PRESUNTO (IVA inclusa): ${eu(totals.total)}`,15,y);y+=6;
 doc.text(`NOTA CREDITO TOTALE (fuori IVA): ${eu(creditNet)}`,15,y);y+=6;
 doc.setFontSize(12);doc.text(`TOTALE DA PAGARE (IVA inclusa): ${eu(totals.pay)}`,15,y);
 doc.save(`DONE_report_${M}.pdf`)
}

render();</script></body></html>
